name: Linux CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    name: Linux Core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
  release:
    name: Linux Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build diagnostic CLI after tests
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/wanctl ./cmd/wanctl
          dist/wanctl interfaces
          (cd dist && sha256sum wanctl > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: wanctl-linux-amd64
          path: dist/
          if-no-files-found: error
